<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("ffa_theme_pref") || "dark";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var mode = dark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111019" />
    <title>SOOFT FINYX — ECR Salud</title>
    <link rel="icon" type="image/png" href="/branding/finyx/soft-finyx-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
